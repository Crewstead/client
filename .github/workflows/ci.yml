name: CI
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  check:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      # Read-only deploy key of the private Crewstead/core, which pnpm fetches over SSH.
      - uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.CORE_DEPLOY_KEY }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24.16.0
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm build
      - name: Pack the web app
        run: tar -czf crewstead-web-${{ github.ref_name }}.tar.gz -C web/build .
      # A version tag publishes a release with the compiled web app (desktop apps join it later).
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" crewstead-web-*.tar.gz --generate-notes --verify-tag
