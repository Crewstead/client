name: CI
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

# Linux jobs run on the hub's own server (label crewstead-vps; the server repository's
# scripts/deploy/runner-setup.sh), not on GitHub's machines, whose minutes the free plan limits.
# Windows and macOS still need GitHub's.
jobs:
  # A release pushes main and its version tag together, and the tag's run checks that commit: the
  # run for main stops here, so the same commit is not tested twice.
  tagged:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: crewstead-vps
    outputs:
      tagged: ${{ steps.tag.outputs.tagged }}
    steps:
      - id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tags=$(gh api --paginate "repos/$GITHUB_REPOSITORY/tags" \
            --jq '.[] | select(.commit.sha == env.GITHUB_SHA) | .name' | grep '^v' || true)
          echo "tagged=$([ -n "$tags" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  check:
    needs: tagged
    if: ${{ !cancelled() && needs.tagged.outputs.tagged != 'true' }}
    # Pull requests from forks never reach the hub's server.
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-24.04' || 'crewstead-vps' }}
    permissions:
      contents: write
    outputs:
      systems: ${{ steps.mac.outputs.systems }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The tags, to compare a release with the one before it.
          fetch-depth: 0
      # Read-only deploy key of the private Crewstead/core, which pnpm fetches over SSH.
      - uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.CORE_DEPLOY_KEY }}
      # The runner on the hub server has no GitHub host keys of its own; GitHub publishes them.
      - name: GitHub host keys
        shell: bash
        run: |
          mkdir -p ~/.ssh
          grep -qs '^github.com ' ~/.ssh/known_hosts ||
            curl -fsSL https://api.github.com/meta | jq -r '.ssh_keys[] | "github.com " + .' >> ~/.ssh/known_hosts
      # The computer service searches with ripgrep and sandboxes commands with bubblewrap; Ubuntu
      # blocks the user namespaces bubblewrap needs unless allowed.
      - uses: ./.github/actions/apt
        with:
          packages: ripgrep bubblewrap
      - name: Let bubblewrap make user namespaces
        run: |
          [ "$(sysctl -n kernel.apparmor_restrict_unprivileged_userns 2>/dev/null || echo 0)" = 0 ] ||
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.16.0
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm build
      - name: Pack the web app
        run: tar -czf crewstead-web-${{ github.ref_name }}.tar.gz -C web/build .
      # A version tag starts a draft release with the compiled web app. It is published once every
      # desktop app has joined it: the apps' updater reads the latest published release, and one
      # without its system's latest*.yml fails their update check.
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" crewstead-web-*.tar.gz --draft --generate-notes --verify-tag
      # macOS minutes cost ten times Linux ones, so the Mac app is built only when the app itself
      # changed since the release before (desktop/, daemon/, dependencies). Otherwise that release's Mac
      # installers and latest-mac.yml join this one, and Macs keep that version.
      - name: Mac app, built or carried over
        id: mac
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          systems='["crewstead-vps","windows-2025","macos-15"]'
          previous=$(git describe --tags --abbrev=0 --match 'v*' HEAD^ 2>/dev/null || true)
          if [ -n "$previous" ] \
            && git diff --quiet "$previous" HEAD -- desktop daemon package.json pnpm-lock.yaml pnpm-workspace.yaml \
            && gh release download "$previous" --dir mac --pattern 'latest-mac.yml' --pattern '*-mac-*'; then
            gh release upload "$GITHUB_REF_NAME" mac/* --clobber
            echo "Carried over the Mac app of $previous."
            systems='["crewstead-vps","windows-2025"]'
          fi
          echo "systems=$systems" >> "$GITHUB_OUTPUT"

  # The computer service's Windows-specific parts (the Claude Code tool bridge's named pipe, which
  # folders may be projects), on a real Windows machine. A release tests them in its Windows build
  # instead, so it does not pay for a second Windows machine.
  windows:
    needs: tagged
    if: >-
      ${{ !cancelled() && needs.tagged.outputs.tagged != 'true' && !startsWith(github.ref, 'refs/tags/v') }}
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.CORE_DEPLOY_KEY }}
      # The runner on the hub server has no GitHub host keys of its own; GitHub publishes them.
      - name: GitHub host keys
        shell: bash
        run: |
          mkdir -p ~/.ssh
          grep -qs '^github.com ' ~/.ssh/known_hosts ||
            curl -fsSL https://api.github.com/meta | jq -r '.ssh_keys[] | "github.com " + .' >> ~/.ssh/known_hosts
      - uses: actions/setup-node@v4
        with:
          node-version: 24.16.0
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vitest run tests/unit/tool-bridge.test.ts

  # A version tag also builds the desktop app on each system and adds its installers to the release.
  desktop:
    needs: [check, windows]
    if: >-
      ${{ !cancelled() && startsWith(github.ref, 'refs/tags/v') && needs.check.result == 'success'
      && (needs.windows.result == 'success' || needs.windows.result == 'skipped') }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.check.outputs.systems) }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.CORE_DEPLOY_KEY }}
      # The runner on the hub server has no GitHub host keys of its own; GitHub publishes them.
      - name: GitHub host keys
        shell: bash
        run: |
          mkdir -p ~/.ssh
          grep -qs '^github.com ' ~/.ssh/known_hosts ||
            curl -fsSL https://api.github.com/meta | jq -r '.ssh_keys[] | "github.com " + .' >> ~/.ssh/known_hosts
      - uses: actions/setup-node@v4
        with:
          node-version: 24.16.0
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Windows-specific parts
        if: runner.os == 'Windows'
        run: pnpm exec vitest run tests/unit/tool-bridge.test.ts
      - name: Version from the tag
        shell: bash
        working-directory: desktop
        run: npm pkg set "version=${GITHUB_REF_NAME#v}"
      - run: pnpm --filter @crewstead/desktop dist
      - name: Add the installers to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          # The installers, and what the apps' updater reads (latest*.yml, block maps).
          gh release upload "$GITHUB_REF_NAME" desktop/dist/Crewstead-*.{AppImage,exe,dmg} \
            desktop/dist/latest*.yml desktop/dist/*.blockmap --clobber

  # Every installer is there: the release goes public. A failed build leaves it a draft, so the
  # apps keep the release before it.
  publish:
    needs: desktop
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/v') && needs.desktop.result == 'success' }}
    runs-on: crewstead-vps
    permissions:
      contents: write
    steps:
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --latest
