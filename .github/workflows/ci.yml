name: CI
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  check:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      # Read-only deploy key of the private Crewstead/core, which pnpm fetches over SSH.
      - uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.CORE_DEPLOY_KEY }}
      # The computer service searches with ripgrep and sandboxes commands with bubblewrap; Ubuntu
      # blocks the user namespaces bubblewrap needs unless allowed.
      - name: Tools the computer service uses
        run: |
          sudo apt-get update -q && sudo apt-get install -yq ripgrep bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.16.0
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm build
      - name: Pack the web app
        run: tar -czf crewstead-web-${{ github.ref_name }}.tar.gz -C web/build .
      # A version tag starts a draft release with the compiled web app. It is published once every
      # desktop app has joined it: the apps' updater reads the latest published release, and one
      # without its system's latest*.yml fails their update check.
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" crewstead-web-*.tar.gz --draft --generate-notes --verify-tag

  # The computer service's Windows-specific parts (the Claude Code tool bridge's named pipe, which
  # folders may be projects), on a real Windows machine.
  windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.CORE_DEPLOY_KEY }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24.16.0
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vitest run tests/unit/tool-bridge.test.ts

  # A version tag also builds the desktop app on each system and adds its installers to the release.
  desktop:
    needs: [check, windows]
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.CORE_DEPLOY_KEY }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24.16.0
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Version from the tag
        shell: bash
        working-directory: desktop
        run: npm pkg set "version=${GITHUB_REF_NAME#v}"
      - run: pnpm --filter @crewstead/desktop dist
      - name: Add the installers to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          # The installers, and what the apps' updater reads (latest*.yml, block maps).
          gh release upload "$GITHUB_REF_NAME" desktop/dist/Crewstead-*.{AppImage,exe,dmg} \
            desktop/dist/latest*.yml desktop/dist/*.blockmap --clobber

  # Every installer is there: the release goes public. A failed build leaves it a draft, so the
  # apps keep the release before it.
  publish:
    needs: desktop
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --latest
