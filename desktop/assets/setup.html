<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'"
    />
    <title>Crewstead</title>
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #191a1f;
        color: #eeeef3;
        font:
          14px/1.5 system-ui,
          sans-serif;
      }
      main {
        width: min(360px, calc(100vw - 32px));
      }
      h1 {
        margin: 0 0 6px;
        font-size: 22px;
        font-weight: 600;
      }
      p {
        margin: 0 0 20px;
        color: #a1a4b1;
      }
      label {
        display: block;
        margin-bottom: 6px;
        color: #c9cbd5;
        font-size: 13px;
      }
      input {
        box-sizing: border-box;
        width: 100%;
        padding: 10px 12px;
        border: 1px solid #373944;
        border-radius: 9px;
        background: #212229;
        color: inherit;
        font: inherit;
      }
      input:focus {
        outline: 2px solid #dfbd82;
        outline-offset: 1px;
      }
      button {
        margin-top: 14px;
        width: 100%;
        padding: 10px;
        border: 0;
        border-radius: 9px;
        background: #ececf2;
        color: #202127;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.6;
        cursor: default;
      }
      [role='alert'] {
        margin: 12px 0 0;
        color: #f87171;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Crewstead</h1>
      <p>Which hub do you use? You sign in on the next page.</p>
      <form id="form">
        <label for="hub">Hub address</label>
        <input
          id="hub"
          type="text"
          required
          autofocus
          placeholder="crewstead.example.org"
          autocomplete="url"
          spellcheck="false"
        />
        <button id="go" type="submit">Continue</button>
        <p id="error" role="alert" hidden></p>
      </form>
    </main>
    <script src="setup.js"></script>
  </body>
</html>
